aid: one-assist
name: One Assist
description: >-
  OneAssist is an Indian consumer protection and services company that provides
  device and appliance protection, extended warranty, and financial-fraud
  assistance to retail customers. Its offerings span gadget protection for
  mobile phones, laptops, wearables, and tablets (accidental damage and extended
  warranty coverage), home appliance repair and maintenance for air
  conditioners, televisions, washing machines, refrigerators, water purifiers,
  and geysers, wallet and card fraud protection, credit-card bill-payment
  assistance, and furniture, motor, and jewelry insurance plans. The company
  reports serving over 1.8 crore active customers across 19,000+ pincodes and
  resolving more than 25 lakh issues. OneAssist is backed by Lightspeed Venture
  Partners. As of this profile, OneAssist publishes no public developer API,
  developer portal, or API documentation; it operates a consumer-facing web and
  mobile experience only.
